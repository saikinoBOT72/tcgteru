<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>食卓バトル β</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000; --paper:#fff; --sub:#555;
  --danger:#c0392b; --ok:#2c8a5f; --block:#2a6ea0;
  --gap:4px;
  /* 画面に必ず収まるカード寸法(縦基準・横で頭打ち) */
  --chrome:calc(142px + env(safe-area-inset-bottom, 0px) + env(safe-area-inset-top, 0px));
  --card-w:min( calc((100dvh - var(--chrome)) / 4 / 1.4), calc((min(100vw,520px) - 42px) / 3) );
  --card-h:calc(var(--card-w) * 1.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  height:100dvh; padding:6px;
  max-width:520px; margin:0 auto;
}
.screen{display:none; flex:1 1 auto; min-height:0; flex-direction:column; gap:var(--gap);}
.screen.active{display:flex;}

#topbar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; height:22px;}
#topbar h1{font-family:"Zen Maru Gothic",sans-serif; font-weight:700; font-size:14px; margin:0; flex:1 1 auto;}
#resetBtn,#homeBtn{font-size:11px; padding:2px 8px; border-radius:7px;}

.board{flex:1 0 auto; display:flex; flex-direction:column; gap:var(--gap); align-items:center; justify-content:center;}
.teamsp{flex:0 0 auto; display:flex; align-items:center; gap:5px; font-size:10px; font-weight:700; height:14px;}
.turn-count{color:var(--sub); font-weight:700; margin-left:3px;}
.teamsp-value{display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:14px; border:1.5px solid var(--ink); border-radius:4px; padding:0 4px; font-weight:900; font-size:10px;}
.row{flex:0 0 auto; display:flex; gap:var(--gap); justify-content:center;}

#centerBar{flex:0 0 auto; min-height:18px; display:flex; align-items:center; justify-content:center; gap:7px; font-size:11px; font-weight:700; text-align:center;}
.midline{flex:1 1 auto; max-width:180px; height:0; border-top:1.5px dashed #c4c4c4;}
.cancel-chip{border:1.5px solid var(--ink); border-radius:50%; width:18px; height:18px; padding:0; font-size:9px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}

#bottombar{flex:0 0 auto;}
button{
  font-family:inherit; font-size:12.5px; border:1.5px solid var(--ink); border-radius:8px; padding:7px 12px;
  background:var(--paper); color:var(--ink); cursor:pointer; font-weight:700;
}
button.end{background:var(--ink); color:var(--paper); width:100%; padding:8px;}
button:disabled{opacity:0.3; cursor:default;}

/* ================= CARD =================
   寸法・枠・内部レイアウトは常に不変。状態はオーバーレイのみで表現する。 */
.card-tile{
  width:var(--card-w); height:var(--card-h); flex:0 0 auto;
  font-size:calc(var(--card-h) / 17);
  position:relative; display:flex; flex-direction:column; overflow:hidden;
  background:var(--paper); color:var(--ink);
  border:1.5px solid var(--ink); border-radius:0.6em;
  box-shadow:0 1px 0 rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.06);
  cursor:default; user-select:none;
}
.card-tile.dead{filter:grayscale(1) contrast(.85); opacity:.4; transition:opacity .5s ease, filter .5s ease;}
.card-tile.clickable{cursor:pointer;}

/* 状態表示はオーバーレイのみ = カード本体の見た目は不変 */
.card-tile.targetable::after,
.card-tile.movedest::after,
.card-tile.movesrc::after{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:9;
}
.card-tile.targetable::after{box-shadow:inset 0 0 0 3px var(--danger); animation:pulseTarget .9s ease-in-out infinite;}
.card-tile.movedest::after{box-shadow:inset 0 0 0 3px var(--block);}
.card-tile.movesrc::after{box-shadow:inset 0 0 0 3px var(--ink);}
@keyframes pulseTarget{0%,100%{opacity:1;} 50%{opacity:.35;}}

.c-accent{flex:0 0 auto; height:.28em;}
.c-head{
  flex:0 0 auto; height:1.95em; display:flex; align-items:center; gap:.25em; padding:0 .3em;
  border-bottom:1px solid var(--ink); position:relative;
}
.c-elem{
  width:1.5em; height:1.5em; border-radius:50%; border:1px solid var(--ink);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  box-shadow:inset 0 -.15em .2em rgba(0,0,0,.18);
}
.c-elem svg{width:68%; height:68%; display:block;}
/* Lvはアート右上のオーバーレイ。名前の幅を一切奪わない */
.c-lv{
  position:absolute; top:.2em; right:.2em; z-index:4;
  font-size:.62em; font-weight:900; letter-spacing:-.02em;
  background:var(--ink); color:var(--paper); border-radius:.25em; padding:0 .3em; line-height:1.55;
  box-shadow:0 0 0 1px rgba(255,255,255,.75);
}
.c-name{
  flex:1 1 auto; min-width:0; font-family:"Zen Maru Gothic",sans-serif; font-weight:700;
  font-size:.95em; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.02em;
}
.c-rarity{
  flex:0 0 auto; font-size:.72em; font-weight:900; border:1.5px solid var(--ink); border-radius:.25em;
  padding:0 .28em; line-height:1.3;
}

.c-art{flex:1 1 auto; min-height:0; position:relative; overflow:hidden; border-bottom:1px solid var(--ink);}
.art{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;}
/* ベータ用の仮キャラ印。Lvと同じくアート上のオーバーレイなので幅を奪わない */
.c-beta{
  position:absolute; top:.2em; left:.2em; z-index:4;
  font-size:.62em; font-weight:900; background:var(--paper); color:var(--ink);
  border:1px solid var(--ink); border-radius:.25em; padding:0 .28em; line-height:1.45;
}
.c-art::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(115deg, rgba(255,255,255,0) 43%, rgba(255,255,255,.34) 50%, rgba(255,255,255,0) 57%);
}

.c-stat{flex:0 0 auto; height:1.35em; display:flex; align-items:center; gap:.22em; padding:0 .3em;}
.c-role{font-size:.68em; font-weight:900; border:1px solid var(--ink); border-radius:.25em; padding:0 .3em; line-height:1.4; flex:0 0 auto;}
.c-role.king{background:var(--ink); color:var(--paper);}
.c-move{
  font-size:.68em; font-weight:900; border:1px solid var(--ink); border-radius:.25em; padding:0 .3em;
  line-height:1.4; flex:0 0 auto; opacity:.22;
}
.c-move.usable{opacity:1; cursor:pointer; background:var(--block); color:#fff; border-color:var(--block);}
.c-hp{margin-left:auto; font-size:.76em; font-weight:900; letter-spacing:-.03em; flex:0 0 auto;}
.c-hpbar{flex:0 0 auto; height:.32em; margin:0 .3em .12em; border:1px solid var(--ink); border-radius:.2em; overflow:hidden; background:var(--paper);}
.c-hpbar i{display:block; height:100%; background:var(--ink); transition:width .38s cubic-bezier(.2,.8,.3,1);}

.c-skills{flex:0 0 auto; border-top:1.5px solid var(--ink); background:#fcfbf7; padding-bottom:.18em;}
.sk{
  height:1.72em; display:flex; align-items:center; gap:.25em; padding:0 .28em;
  border-bottom:1px solid rgba(0,0,0,.28); position:relative;
}
.sk:last-child{border-bottom:none;}
/* スキル数が3未満のカードの空き枠 */
.sk.empty{background:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(0,0,0,.05) 4px,rgba(0,0,0,.05) 8px);}
/* Lvが足りず未解放のスキル */
.sk.locked{background:#eceae4;}
.sk.locked .sk-name{color:#8a8a84;}
.sk.locked .sk-detail{color:#9a9a94; font-weight:700;}
.sk.locked .sk-tag{background:#8a8a84; color:#fff; border-color:#6f6f6a;}
.sk.king{background:#efefef;}
.sk-tag{
  flex:0 0 auto; width:1.25em; height:1.25em; border-radius:.18em; border:1px solid var(--ink);
  font-size:.6em; font-weight:900; display:flex; align-items:center; justify-content:center; line-height:1;
}
.sk-body{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; justify-content:center;}
.sk-name{font-size:.92em; font-weight:700; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sk-detail{font-size:.73em; line-height:1.05; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sk-go{flex:0 0 auto; font-size:.7em; color:var(--ok); font-weight:900;}
.sk.usable{cursor:pointer;}
.sk.usable::before{content:''; position:absolute; left:0; top:0; bottom:0; width:.22em; background:var(--ok);}
.sk.usable:active{background:#e9f5ee;}

.c-status{position:absolute; top:2.35em; left:.2em; display:flex; flex-direction:column; gap:.12em; z-index:8;}
.st{font-size:.66em; font-weight:900; padding:0 .28em; border-radius:.25em; border:1px solid var(--ink);
  background:var(--paper); line-height:1.45; white-space:nowrap; box-shadow:0 1px 0 rgba(0,0,0,.25);}
.st b{font-weight:900; opacity:.62; margin-left:.15em;}
.st.seal{color:#5b3b8a;}
.st.burn{color:var(--danger);} .st.poison{color:#5c3a99;} .st.freeze{color:var(--block);} .st.paralyze{color:#8a6f0c;}
.st.up{color:var(--ok);} .st.down{color:var(--danger);}

/* ================= FX LAYER ================= */
#fxLayer{position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden;}
.fx-num{
  position:absolute; transform:translate(-50%,-50%); font-family:"Zen Maru Gothic",sans-serif;
  font-weight:700; font-size:34px; white-space:nowrap;
  -webkit-text-stroke:6px #fff; paint-order:stroke fill; letter-spacing:-.03em;
}
.fx-num.damage{color:var(--danger);} .fx-num.block{color:var(--block);}
.fx-num.buff{color:var(--ok); font-size:21px;} .fx-num.neutral{color:var(--ink); font-size:17px;}
/* 技名の帯:攻撃者の上に出る */
.fx-banner{
  position:absolute; transform:translate(-50%,-50%); background:var(--paper); color:var(--ink);
  font-family:"Zen Maru Gothic",sans-serif; font-weight:700;
  font-size:11.5px; padding:3px 9px; border-radius:5px; white-space:nowrap;
  border:2px solid var(--ink); box-shadow:2px 2px 0 rgba(0,0,0,.35);
}
/* 状態異常・連撃などの小チップ */
.fx-chip{
  position:absolute; transform:translate(-50%,-50%); background:var(--ink); color:var(--paper);
  font-size:10px; font-weight:900; padding:2px 7px; border-radius:4px; white-space:nowrap;
}
.fx-ko{
  position:absolute; transform:translate(-50%,-50%);
  font-family:"Zen Maru Gothic",sans-serif; font-weight:700; font-size:19px; letter-spacing:.04em;
  color:var(--paper); background:var(--ink); padding:2px 10px; border-radius:5px;
  border:2px solid var(--paper); box-shadow:0 0 0 2px var(--ink);
}
/* 着弾の閃光 */
.fx-flash{position:absolute; transform:translate(-50%,-50%); border-radius:8px;}
/* 弾の尾 */
.fx-trail{position:absolute; width:12px; height:12px; border-radius:50%; opacity:0;}
.fx-aff{
  position:absolute; transform:translate(-50%,-50%); font-family:"Zen Maru Gothic",sans-serif;
  font-weight:700; font-size:15px; padding:2px 8px; border-radius:4px; white-space:nowrap; border:2px solid var(--ink);
  box-shadow:2px 2px 0 rgba(0,0,0,.3);
}
.fx-aff.weak{background:#ffe14d; color:#7a1f16;}
.fx-aff.resist{background:#dde6ee; color:#2a4a66;}
.fx-aff.null{background:#333; color:#fff;}
.fx-proj{position:absolute; transform:translate(-50%,-50%); width:16px; height:16px;}
.fx-ringbox{position:absolute; transform:translate(-50%,-50%); border:3px solid #000; border-radius:.6em; box-sizing:border-box;}
.fx-burst{position:absolute; transform:translate(-50%,-50%); width:96px; height:96px;}

/* ================= HOME ================= */
#screenHome{justify-content:center; align-items:center; gap:0; padding-bottom:8px;}
.home-title{font-family:"Zen Maru Gothic",sans-serif; font-weight:700; font-size:30px; letter-spacing:.02em; margin:0;}
.home-sub{font-size:11px; color:var(--sub); margin:4px 0 0;}
.home-crest{display:flex; gap:8px; margin:18px 0 22px;}
.edot{
  border-radius:50%; border:2px solid var(--ink); display:inline-flex;
  align-items:center; justify-content:center; box-shadow:0 2px 0 var(--ink); flex:0 0 auto;
}
.edot svg{width:60%; height:60%; display:block;}
.home-menu{display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px;}
.menu-btn{
  display:block; width:100%; text-align:left; position:relative;
  border:2px solid var(--ink); border-radius:12px; padding:13px 16px 13px 18px; font-size:15px;
  background:var(--paper); box-shadow:3px 3px 0 var(--ink);
}
.menu-btn::before{content:''; position:absolute; left:0; top:10px; bottom:10px; width:4px; background:var(--ink); border-radius:0 3px 3px 0;}
.menu-btn.primary::before{background:var(--paper);}
.menu-btn:active:not(:disabled){transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
.menu-btn.primary{background:var(--ink); color:var(--paper);}
.menu-btn .msub{display:block; font-size:10px; font-weight:400; opacity:.75; margin-top:3px;}
.home-deck{margin-top:16px; display:flex; flex-direction:column; align-items:center; gap:4px;}
.home-deck-label{font-size:10px; color:var(--sub); font-weight:700;}
/* プレビューも簡略タイルではなく本物のカード。寸法だけ小さい */
.mini-row{display:flex; gap:4px; justify-content:center;}
.home-deck .card-tile{
  width:var(--hcard-w); height:calc(var(--hcard-w) * 1.4);
  font-size:calc(var(--hcard-w) * 1.4 / 17);
}

/* ================= DECK =================
   陣形も一覧も表示するのは本物のカード。簡略タイルは使わない。
   カードの内部レイアウトは font-size:calc(高さ/17) で高さに追従する
   ので、寸法が変わっても構成・比率は完全に同一のまま。 */
:root{
  --dcard-w:calc((min(100vw,520px) - 45px) / 3);          /* 一覧のカード(3枚並ぶ幅) */
  --dcard-h:calc(var(--dcard-w) * 1.4);
  --fcard-w:calc(var(--dcard-w) * .70);                   /* 陣形のカード */
  --fcard-h:calc(var(--fcard-w) * 1.4);
  --hcard-w:76px;                                         /* ホームのプレビュー */
}
#screenDeck{gap:5px;}
.deck-head{flex:0 0 auto; display:flex; align-items:center; gap:6px; height:26px;}
.deck-head h2{font-family:"Zen Maru Gothic",sans-serif; font-size:14px; margin:0; flex:1 1 auto;}
.back-btn{font-size:10.5px; padding:3px 8px; border-radius:7px; flex:0 0 auto;}
.deck-count{font-size:10px; font-weight:700; color:var(--sub); flex:0 0 auto;}

/* 2ステップの見出し */
.step{flex:0 0 auto; display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; line-height:1.2;}
.step b{
  flex:0 0 auto; width:16px; height:16px; border-radius:50%; background:var(--ink); color:var(--paper);
  display:flex; align-items:center; justify-content:center; font-size:10px;
}

.formation{
  flex:0 0 auto; border:1.5px solid var(--ink); border-radius:10px; padding:5px;
  display:flex; flex-direction:column; gap:4px; align-items:center;
}
.form-row{display:flex; gap:4px; justify-content:center;}
.fslot{position:relative; cursor:pointer; flex:0 0 auto; padding-bottom:11px;}
.formation .card-tile{
  width:var(--fcard-w); height:var(--fcard-h); font-size:calc(var(--fcard-h) / 17); cursor:pointer;
}
/* 選択中はカードの外側にオーバーレイを重ねるだけ。カード自体は不変 */
.fslot.sel .card-tile::after{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:9;
  box-shadow:inset 0 0 0 3px var(--ok);
}
.sel-flag{
  position:absolute; left:50%; bottom:0; transform:translateX(-50%); z-index:10;
  background:var(--ok); color:#fff; white-space:nowrap;
  font-size:8px; font-weight:900; padding:0 6px; line-height:1.5; border-radius:4px;
}
.sel-flag::before{
  content:''; position:absolute; left:50%; top:-4px; transform:translateX(-50%);
  border:4px solid transparent; border-bottom-color:var(--ok); border-top:0;
}
.card-tile.empty-slot{
  display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--sub);
  background:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(0,0,0,.05) 4px,rgba(0,0,0,.05) 8px);
}

.deck-list{
  flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  border:1.5px solid var(--ink); border-radius:10px; padding:6px;
}
.deck-grid{display:flex; flex-wrap:wrap; gap:6px; justify-content:center;}
.deck-item{display:flex; flex-direction:column; gap:3px; align-items:center; width:var(--dcard-w);}
.deck-grid .card-tile{
  width:var(--dcard-w); height:var(--dcard-h); font-size:calc(var(--dcard-h) / 17); cursor:pointer;
}
.deck-grid .card-tile.placed::after{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:9;
  box-shadow:inset 0 0 0 3px var(--ok); background:rgba(255,255,255,.3);
}
.deck-grid .card-tile .placed-tag{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:10;
  background:var(--ok); color:#fff; font-size:9px; font-weight:900; padding:2px 6px;
  border-radius:5px; border:1.5px solid var(--ink); white-space:nowrap;
}
.plv{
  width:100%; font-size:9.5px; font-weight:900; padding:2px; border-radius:5px;
  border:1.5px solid var(--ink); background:var(--ink); color:var(--paper); line-height:1.35;
}
.deck-foot{flex:0 0 auto;}

/* ================= 勝敗 ================= */
.ovl{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:70; padding:20px;}
.ovl-card{background:var(--paper); border:2.5px solid var(--ink); border-radius:16px; padding:22px 26px; text-align:center; box-shadow:6px 6px 0 var(--ink);}
.ovl-card h2{font-family:"Zen Maru Gothic",sans-serif; font-size:24px; margin:0 0 4px; letter-spacing:.06em;}
.ovl-card .sub{font-size:11px; color:var(--sub); margin:0 0 14px; letter-spacing:.12em; text-transform:uppercase;}
.ovl-card.win h2{color:var(--ok);}
.ovl-card.lose h2{color:var(--danger);}
.ovl-card.draw h2{color:var(--sub);}
</style>
</head>
<body>

<svg id="artDefs" width="0" height="0" style="position:absolute"></svg>

<div class="screen" id="screenHome"></div>

<div class="screen" id="screenDeck"></div>

<div class="screen" id="screenBattle">
  <div id="topbar">
    <h1>食卓バトル β</h1>
    <div style="display:flex;gap:5px;">
      <button id="resetBtn" onclick="startCpuBattle()">やり直す</button>
      <button id="homeBtn" onclick="showScreen('home')">ホーム</button>
    </div>
  </div>

  <div class="board">
    <div class="teamsp" id="enemySP"></div>
    <div class="row" id="enemyBack"></div>
    <div class="row" id="enemyFront"></div>
  </div>

  <div id="centerBar"></div>

  <div class="board">
    <div class="row" id="playerFront"></div>
    <div class="row" id="playerBack"></div>
    <div class="teamsp" id="playerSP"></div>
  </div>

  <div id="bottombar">
    <button class="end" id="endTurnBtn" onclick="onEndTurn()">ターン終了</button>
  </div>
</div>

<div id="fxLayer"></div>
<div id="ovlRoot"></div>

<script src="src/data.js"></script>
<script src="src/fx.js"></script>
<script src="src/battle.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
